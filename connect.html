<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Shakha · Connecting your Google account</title><link rel="stylesheet" href="style.css">
<style>
.cx{max-width:560px;margin:24px auto;background:#fff;border:1px solid #DDD8C8;border-radius:16px;padding:24px 22px;box-sizing:border-box}
.cx h1{font-size:20px;margin:0 0 12px}.cx p,.cx li{font-size:15px;line-height:1.55;text-align:justify}.cx ul{padding-left:20px}
.cx .btns{margin:22px 0 8px}.cx .note{font-size:13px;color:#5A665F}
.spin{width:28px;height:28px;border:3px solid #DDD8C8;border-top-color:#17614A;border-radius:50%;animation:r 0.9s linear infinite;margin:8px 0 14px}
@keyframes r{to{transform:rotate(360deg)}}
@media(max-width:600px){.cx{margin:12px 0;padding:20px 16px}}
</style></head><body>
<header class="wrap"><svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#17614A"/><path d="M60 100V44M60 76L34 54M60 62L88 40" stroke="#F7F3E8" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="60" cy="32" r="12" fill="#F2B632"/><circle cx="34" cy="54" r="9" fill="#F2B632"/><circle cx="88" cy="40" r="9" fill="#F2B632"/></svg><div><div class="bn">Shakha</div><div class="bt">Billing and Compliance for CA firms</div></div></header>
<main class="wrap"><div class="cx" id="box"><h1>Connecting your Google account</h1><div class="spin"></div><p>Please keep this page open. Shakha is setting up your firm's folder and data sheet in your Google Drive. This takes a few seconds.</p></div></main>
<footer class="wrap">© 2026 Shakha · Billing and Compliance for CA firms · Contact: <a href="mailto:admin.shakha@gmail.com">admin.shakha@gmail.com</a></footer>
<script>
/* Shakha web app address (Deploy → Manage deployments → Web app URL, ending in /exec) */
var APP = 'https://script.google.com/macros/s/AKfycbwVDujfSQWbsWiHeTl8pIB4ahPFIq5ZoTnWhdWn8kg-L7Pw5lggYBS0LNjfLDA83gbV7Q/exec';
(function () {
  var box = document.getElementById('box');
  var q = new URLSearchParams(location.search), st = q.get('state') || '', code = q.get('code') || '', er = q.get('error') || '';
  function show(t, h) { box.innerHTML = '<h1></h1>' + h; box.firstChild.textContent = t; document.title = 'Shakha · ' + t; }
  if (!st || !(code || er)) { show('Open the link from your email', '<p>To connect your firm\'s Google account, open the <b>Connect my Google account</b> link in the email from Shakha.</p>'); return; }
  /* the code works only once: take it out of the address bar so a refresh or a shared link can't reuse it */
  try { history.replaceState(null, '', location.pathname); } catch (e) { }
  var args = 'state=' + encodeURIComponent(st) + (code ? '&code=' + encodeURIComponent(code) : '') + (er ? '&error=' + encodeURIComponent(er) : '');
  function fallback() {
    show('Almost done', '<p>Your browser couldn\'t reach Shakha from this page. Tap the button below to finish connecting.</p>' +
      '<p class="btns"><a class="btn" href="' + APP + '?' + args + '" target="_top">Finish connecting</a></p>' +
      '<p class="note">If that shows an error, open the connect link from your email again in a private (incognito) window and sign in only with your firm\'s Google account.</p>');
  }
  var done = false, t = setTimeout(function () { if (!done) { done = true; fallback(); } }, 60000);
  fetch(APP + '?gx=1&' + args, { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (o) { if (done) return; done = true; clearTimeout(t); show(o.title || 'Done', o.html || ''); })
    .catch(function () { if (done) return; done = true; clearTimeout(t); fallback(); });
})();
</script>
</body></html>
