<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Accept engagement letter</title><link rel="icon" href="shakha360-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>
.cx{max-width:620px;margin:24px auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-sizing:border-box}
.cx h1{font-size:20px;margin:0 0 6px}.cx h2{font-size:16px;margin:18px 0 6px}.cx p{font-size:15px;line-height:1.55}.mu{font-size:13px;color:var(--mu)}
.rw{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px;margin:10px 0}.rw b{font-weight:600}.rw span{overflow-wrap:anywhere}
.fl{margin:10px 0}.fl label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}.fl input{width:100%;box-sizing:border-box;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.bt{display:inline-block;font:inherit;font-size:15px;font-weight:700;background:#17614A;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin:6px 8px 6px 0}.bt.sec{background:transparent;color:#17614A;border:1px solid #17614A}.bt[disabled]{opacity:.5;cursor:default}
.ln{font-size:13px;margin-top:6px;overflow-wrap:anywhere}.ln.bad{color:#B3261E}.ln.ok{color:#17614A}
.ok-box{border:1px solid #17614A;border-left:5px solid #17614A;border-radius:8px;padding:12px 14px;margin:12px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:#17614A;border-radius:50%;animation:r .9s linear infinite;margin:8px 0 14px}@keyframes r{to{transform:rotate(360deg)}}
.code{font-size:22px;letter-spacing:6px;text-align:center}
@media(max-width:600px){.cx{margin:12px 0;padding:20px 16px}.rw{grid-template-columns:1fr}}
</style></head><body>
<main class="wrap docMain" id="main"><div class="cx" id="box" aria-live="polite"><h1>Opening the letter</h1><div class="spin"></div></div><p style="text-align:center;font-size:13px;opacity:.75;margin:18px 0 8px"><a href="privacy.html" target="_blank" rel="noopener" style="color:inherit">Privacy Policy</a> · <a href="terms.html" target="_blank" rel="noopener" style="color:inherit">Terms of Use</a></p></main>
<script>
/* Shakha 360 web app address (the same one as connect.html and upload.html) */
var APP = 'https://shakha360-327918432563.asia-south1.run.app/exec';
var APP_READY = fetch('shakha-config.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (c) { if (c && /^https:\/\//.test(c.api || '')) APP = c.api; }).catch(function () { });
(function () {
  var q = new URLSearchParams(location.search), K = { f: q.get('f') || '', d: q.get('d') || '', t: q.get('t') || '' };
  var box = document.getElementById('box'), info = null, pdfUrl = '';
  /* everything shown here is set as text, never as page code */
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fail(t, m) { box.textContent = ''; box.appendChild(el('h1', '', t)); box.appendChild(el('p', '', m)); }
  function post(o) { var b = {}; for (var k in K) b[k] = K[k]; for (var j in o) b[j] = o[j];
    return APP_READY.then(function () { return fetch(window.SHAKHA_APP || APP, { method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store', body: JSON.stringify(b) }); }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function row(host, k, v) { if (!v) return; host.appendChild(el('b', '', k)); host.appendChild(el('span', '', v)); }
  function field(host, id, label, val, ph) { var d = el('div', 'fl'), l = el('label', '', label), i = el('input'); l.htmlFor = id; i.id = id; i.value = val || ''; if (ph) i.placeholder = ph; i.autocomplete = 'off'; d.appendChild(l); d.appendChild(i); host.appendChild(d); return i; }
  function openPdf(btn, note) {
    if (pdfUrl) { window.open(pdfUrl, '_blank'); return; }
    btn.disabled = true; note.textContent = 'Getting the letter…'; note.className = 'ln';
    post({ ac: 'pdf' }).then(function (j) { btn.disabled = false; if (!j.ok) { note.textContent = j.error || 'Please try again.'; note.className = 'ln bad'; return; }
      var bin = atob(j.base64), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      pdfUrl = URL.createObjectURL(new Blob([u], { type: 'application/pdf' })); note.textContent = ''; btn.textContent = 'Open the letter again';
      var a = el('a', 'bt sec', 'Download the letter'); a.href = pdfUrl; a.download = j.name || 'Engagement letter.pdf'; btn.after(a); window.open(pdfUrl, '_blank');
    }, function () { btn.disabled = false; note.textContent = 'Shakha 360 couldn\'t be reached just now. Please try again.'; note.className = 'ln bad'; });
  }
  function done(o) {
    document.title = 'Engagement letter accepted · ' + info.firm; box.textContent = '';
    box.appendChild(el('h1', '', 'Thank you. The letter is accepted.'));
    var b = el('div', 'ok-box'); var r = el('div', 'rw'); row(r, 'Letter', 'Engagement letter, FY ' + info.fy + ', dated ' + info.date); row(r, 'Firm', info.firm + (info.office ? ', ' + info.office : '')); row(r, 'Client', info.client);
    row(r, 'Accepted by', (o.name || info.name) + (o.designation || info.designation ? ', ' + (o.designation || info.designation) : '')); row(r, 'On', o.at || info.at); row(r, 'Reference', o.ref || info.ref); row(r, 'SHA-256 of the letter', info.hash); b.appendChild(r); box.appendChild(b);
    box.appendChild(el('p', 'mu', o.mailed === false ? 'The confirmation email could not be sent just now; the firm has the acceptance on record.' : 'A confirmation with the letter attached has been emailed to ' + info.to + ' and to the firm. Keep it with the letter. The SHA-256 above lets anyone check that the letter has not changed.'));
    var btn = el('button', 'bt sec', 'Open the letter'), note = el('div', 'ln'); btn.type = 'button'; btn.onclick = function () { openPdf(btn, note); }; box.appendChild(btn); box.appendChild(note);
  }
  function draw(o) {
    info = o; document.title = 'Accept engagement letter · ' + o.firm;
    if (o.status === 'accepted') return done({});
    box.textContent = '';
    box.appendChild(el('h1', '', 'Engagement letter for FY ' + o.fy));
    box.appendChild(el('p', '', o.firm + (o.office ? ', ' + o.office : '') + ' asks ' + o.client + ' to read and accept its engagement letter dated ' + o.date + ', which sets out the scope of its work, the responsibilities of each side and its fees.'));
    var btn = el('button', 'bt', 'Read the letter (PDF)'), note = el('div', 'ln'); btn.type = 'button'; btn.onclick = function () { openPdf(btn, note); }; box.appendChild(btn); box.appendChild(note);
    box.appendChild(el('h2', '', 'Accept the letter'));
    box.appendChild(el('p', 'mu', 'Type your details, ask for a code, and type the code from your email. Accepting here has the same effect as signing and returning the letter.'));
    var nm = field(box, 'nm', 'Your name', '', 'As it should appear on the letter');
    var ds = o.individual ? null : field(box, 'ds', 'Your designation', o.desig || '', 'Director, Partner, Proprietor…');
    var idn = o.idLabel ? field(box, 'idn', 'Your ' + o.idLabel + ' (optional)', '', '8 digits') : null;
    var p = el('p', 'mu', 'A 6-digit code will be emailed to ' + o.to + ', the address the firm has for you.'); box.appendChild(p);
    var cb = el('button', 'bt sec', 'Email me the code'), cn = el('div', 'ln'); cb.type = 'button'; box.appendChild(cb); box.appendChild(cn);
    var cd = field(box, 'cd', 'Code from the email', '', '6 digits'); cd.inputMode = 'numeric'; cd.maxLength = 6; cd.className = 'code'; cd.autocomplete = 'one-time-code';
    var ab = el('button', 'bt', 'Accept the letter'), an = el('div', 'ln'); ab.type = 'button'; box.appendChild(ab); box.appendChild(an);
    box.appendChild(el('p', 'mu', 'By accepting, you confirm that you are authorised to do so for ' + o.client + '. The time, the device used and the address the code was sent to are kept with the letter.'));
    cb.onclick = function () { cb.disabled = true; cn.textContent = 'Sending…'; cn.className = 'ln';
      post({ ac: 'code' }).then(function (j) { cb.disabled = false; if (!j.ok) { cn.textContent = j.error || 'Please try again.'; cn.className = 'ln bad'; return; } cn.textContent = 'Sent to ' + j.to + '. It works for 10 minutes; check the spam folder too.'; cn.className = 'ln ok'; cd.focus(); },
        function () { cb.disabled = false; cn.textContent = 'Shakha 360 couldn\'t be reached just now. Please try again.'; cn.className = 'ln bad'; }); };
    ab.onclick = function () { an.className = 'ln bad';
      if (!nm.value.trim()) { an.textContent = 'Please type your name.'; nm.focus(); return; } if (ds && !ds.value.trim()) { an.textContent = 'Please type your designation.'; ds.focus(); return; }
      if (!/^\d{6}$/.test(cd.value.trim())) { an.textContent = 'Type the 6-digit code from your email.'; cd.focus(); return; }
      ab.disabled = true; an.textContent = 'Accepting…'; an.className = 'ln';
      post({ ac: 'accept', name: nm.value.trim(), desig: ds ? ds.value.trim() : '', idno: idn ? idn.value.trim() : '', code: cd.value.trim(), ua: navigator.userAgent }).then(function (j) { if (!j.ok) { ab.disabled = false; an.textContent = j.error || 'Please try again.'; an.className = 'ln bad'; return; } info.name = j.name; info.designation = ds ? ds.value.trim() : ''; done(j); },
        function () { ab.disabled = false; an.textContent = 'Shakha 360 couldn\'t be reached just now. Please try again.'; an.className = 'ln bad'; }); };
  }
  if (!K.f || !K.d || !K.t) return fail('Open the link from your email', 'Please open this page from the link the firm sent you.');
  post({ ac: 'info' }).then(function (o) { if (!o.ok) return fail('This link can\'t be used', o.error || 'Please ask the firm for a new one.'); draw(o); })
    .catch(function () { fail('Please try again', 'Shakha 360 couldn\'t be reached just now. Check your internet connection and open the link again.'); });
})();
</script>
</body></html>
